[project]
name = "sentinel"
version = "0.1.0"
description = "Self-hosted monitoring, alerting, and self-healing for a home lab"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.15",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
sentinel = "sentinel.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.black]
line-length = 100